<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>TCMG Goussainville</title><style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #071d13;
  color: #10251b;
  overflow-x: hidden;
}

/* =========================
   TERRAIN DE TENNIS
========================= */

.page {
  min-height: 100vh;
  position: relative;
  overflow: hidden;

  background:
    linear-gradient(
      rgba(5, 35, 22, 0.18),
      rgba(3, 25, 16, 0.48)
    ),
    #0d4b2e;
}

/* Lignes du terrain */

.page::before {
  content: "";
  position: absolute;
  inset: 0;

  background:
    /* ligne extérieure gauche */
    linear-gradient(
      90deg,
      transparent 7%,
      rgba(255,255,255,.55) 7.2%,
      rgba(255,255,255,.55) 7.5%,
      transparent 7.7%
    ),

    /* ligne extérieure droite */
    linear-gradient(
      90deg,
      transparent 92.3%,
      rgba(255,255,255,.55) 92.5%,
      rgba(255,255,255,.55) 92.8%,
      transparent 93%
    ),

    /* ligne horizontale haute */
    linear-gradient(
      0deg,
      transparent 19%,
      rgba(255,255,255,.55) 19.2%,
      rgba(255,255,255,.55) 19.5%,
      transparent 19.7%
    ),

    /* ligne horizontale basse */
    linear-gradient(
      0deg,
      transparent 80.3%,
      rgba(255,255,255,.55) 80.5%,
      rgba(255,255,255,.55) 80.8%,
      transparent 81%
    ),

    /* ligne centrale */
    linear-gradient(
      90deg,
      transparent 49.7%,
      rgba(255,255,255,.42) 49.8%,
      rgba(255,255,255,.42) 50.2%,
      transparent 50.3%
    ),

    /* lignes de service */
    linear-gradient(
      0deg,
      transparent 37%,
      rgba(255,255,255,.42) 37.2%,
      rgba(255,255,255,.42) 37.5%,
      transparent 37.7%
    ),

    linear-gradient(
      0deg,
      transparent 62.3%,
      rgba(255,255,255,.42) 62.5%,
      rgba(255,255,255,.42) 62.8%,
      transparent 63%
    );

  opacity: .7;
  pointer-events: none;
}

/* texture du terrain */

.page::after {
  content: "";
  position: absolute;
  inset: 0;

  background:
    radial-gradient(
      ellipse at 20% 20%,
      rgba(255,255,255,.08),
      transparent 30%
    ),
    radial-gradient(
      ellipse at 80% 65%,
      rgba(0,0,0,.25),
      transparent 35%
    ),
    repeating-linear-gradient(
      115deg,
      rgba(255,255,255,.015) 0px,
      rgba(255,255,255,.015) 2px,
      transparent 2px,
      transparent 7px
    );

  pointer-events: none;
}

/* =========================
   CONTENU
========================= */

.container {
  width: 100%;
  max-width: 560px;
  min-height: 100vh;
  margin: auto;
  position: relative;
  z-index: 2;

  padding: 35px 18px 45px;
}

/* =========================
   HEADER
========================= */

.header {
  text-align: center;
  color: white;
  padding-top: 15px;
  margin-bottom: 35px;
}

.ball {
  width: 76px;
  height: 76px;
  margin: 0 auto 12px;

  border-radius: 50%;

  background: #d8ef42;

  box-shadow:
    0 10px 30px rgba(0,0,0,.3),
    inset -8px -8px 15px rgba(0,0,0,.08);

  position: relative;
}

/* couture de la balle */

.ball::before,
.ball::after {
  content: "";
  position: absolute;

  width: 35px;
  height: 65px;

  border: 4px solid white;
  border-left: none;

  border-radius: 50%;
}

.ball::before {
  left: 4px;
  top: 5px;
  transform: rotate(8deg);
}

.ball::after {
  right: 4px;
  top: 5px;
  transform: rotate(-8deg);
}

.logo-title {
  font-size: clamp(60px, 17vw, 92px);
  line-height: .85;
  font-weight: 900;
  letter-spacing: -5px;

  color: #fff8e8;

  text-shadow:
    0 7px 18px rgba(0,0,0,.28);
}

.city {
  margin-top: 12px;

  font-size: 26px;
  font-weight: 700;
  letter-spacing: 1px;

  color: #f0a77e;
}

.tagline {
  margin-top: 15px;

  font-size: 17px;
  letter-spacing: 1px;

  color: rgba(255,255,255,.78);
}

/* =========================
   BOUTONS
========================= */

.links {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.btn {
  min-height: 92px;

  display: flex;
  align-items: center;

  padding: 14px 20px;

  background: #fff8e9;
  color: #11251b;

  border-radius: 23px;

  text-decoration: none;

  box-shadow:
    0 12px 30px rgba(0,0,0,.20);

  transition:
    transform .18s ease,
    box-shadow .18s ease;
}

.btn:hover {
  transform: translateY(-3px);

  box-shadow:
    0 16px 35px rgba(0,0,0,.28);
}

.btn:active {
  transform: scale(.985);
}

/* icône */

.icon {
  width: 58px;
  height: 58px;

  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  margin-right: 18px;

  flex-shrink: 0;

  font-size: 27px;

  color: white;
}

.instagram {
  background: linear-gradient(
    135deg,
    #833ab4,
    #fd1d1d,
    #fcb045
  );
}

.tiktok {
  background: #101714;
}

.facebook {
  background: #1877f2;
}

.shop {
  background: #d95d2d;
}

.tenup {
  background: #a9c62d;
}

/* texte */

.btn-content {
  flex: 1;
}

.btn-title {
  display: block;

  font-size: 20px;
  font-weight: 800;
}

.btn-subtitle {
  display: block;

  margin-top: 5px;

  font-size: 14px;
  font-style: italic;

  color: #778078;
}

.arrow {
  font-size: 30px;
  color: #6c7c72;
  margin-left: 10px;
}

/* =========================
   FOOTER
========================= */

.footer {
  margin-top: 30px;

  text-align: center;

  color: rgba(255,255,255,.55);

  font-size: 12px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 400px) {

  .container {
    padding-left: 14px;
    padding-right: 14px;
  }

  .logo-title {
    font-size: 64px;
  }

  .city {
    font-size: 23px;
  }

  .tagline {
    font-size: 15px;
  }

  .btn {
    min-height: 82px;
    padding: 12px 15px;
  }

  .icon {
    width: 50px;
    height: 50px;
    margin-right: 13px;
    font-size: 23px;
  }

  .btn-title {
    font-size: 17px;
  }

  .btn-subtitle {
    font-size: 12px;
  }
}
