<!DOCTYPE html><html lang="fr">
<head>
<meta charset="UTF-8">

<meta name="theme-color" content="#07351f"><title>TCMG Goussainville</title><style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  min-height: 100vh;
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
               "Segoe UI", sans-serif;
  background: #07351f;
  overflow-x: hidden;
}

/* =========================
   TERRAIN
========================= */

.page {
  min-height: 100vh;
  position: relative;
  overflow: hidden;

  background:
    linear-gradient(
      rgba(3, 32, 19, .15),
      rgba(3, 32, 19, .48)
    ),
    #0d5a35;
}

/* Lignes du terrain */

.court-lines {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: .6;
}

.court-lines::before {
  content: "";
  position: absolute;
  inset: 7%;
  border: 3px solid rgba(255,255,255,.55);
  border-radius: 2px;
}

.court-lines::after {
  content: "";
  position: absolute;

  left: 7%;
  right: 7%;
  top: 50%;

  height: 3px;

  background: rgba(255,255,255,.48);

  box-shadow:
    0 -145px 0 rgba(255,255,255,.38),
    0 145px 0 rgba(255,255,255,.38);
}

/* texture */

.texture {
  position: absolute;
  inset: 0;

  background:
    radial-gradient(
      circle at 15% 20%,
      rgba(255,255,255,.09),
      transparent 28%
    ),
    radial-gradient(
      circle at 85% 65%,
      rgba(0,0,0,.24),
      transparent 35%
    ),
    repeating-linear-gradient(
      115deg,
      rgba(255,255,255,.018) 0,
      rgba(255,255,255,.018) 2px,
      transparent 2px,
      transparent 8px
    );

  pointer-events: none;
}

/* =========================
   CONTENU
========================= */

.container {
  width: 100%;
  max-width: 560px;
  min-height: 100vh;

  margin: auto;

  position: relative;
  z-index: 3;

  padding: 28px 18px 40px;
}

/* =========================
   HEADER
========================= */

.header {
  text-align: center;
  color: white;

  padding-top: 5px;
  margin-bottom: 30px;

  animation: headerAppear .8s ease both;
}

/* vrai logo */

.club-logo {
  width: 90px;
  height: 90px;

  object-fit: contain;

  margin: 0 auto 10px;

  background: white;
  border-radius: 50%;

  padding: 6px;

  box-shadow:
    0 10px 30px rgba(0,0,0,.28);

  animation: logoFloat 4s ease-in-out infinite;
}

/* TCMG */

.logo-title {
  font-size: clamp(58px, 17vw, 90px);

  line-height: .82;

  font-weight: 950;

  letter-spacing: -5px;

  color: #fff7e8;

  text-shadow:
    0 8px 20px rgba(0,0,0,.3);
}

.city {
  margin-top: 12px;

  font-size: 26px;

  font-weight: 750;

  letter-spacing: 1px;

  color: #f0a77e;
}

.tagline {
  margin-top: 13px;

  font-size: 16px;

  letter-spacing: 1px;

  color: rgba(255,255,255,.78);
}

/* =========================
   CARTES
========================= */

.links {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.btn {
  min-height: 88px;

  display: flex;
  align-items: center;

  padding: 13px 18px;

  background: #fff8e9;

  color: #11251b;

  border-radius: 22px;

  text-decoration: none;

  box-shadow:
    0 12px 30px rgba(0,0,0,.2);

  opacity: 0;

  animation: cardAppear .65s cubic-bezier(.2,.8,.2,1) forwards;

  transition:
    transform .2s ease,
    box-shadow .2s ease;
}

.btn:nth-child(1) { animation-delay: .15s; }
.btn:nth-child(2) { animation-delay: .25s; }
.btn:nth-child(3) { animation-delay: .35s; }
.btn:nth-child(4) { animation-delay: .45s; }
.btn:nth-child(5) { animation-delay: .55s; }

.btn:hover {
  transform: translateY(-4px) scale(1.01);

  box-shadow:
    0 18px 38px rgba(0,0,0,.3);
}

.btn:active {
  transform: scale(.97);
}

/* =========================
   LOGOS APPLICATIONS
========================= */

.icon {
  width: 57px;
  height: 57px;

  border-radius: 17px;

  display: flex;
  align-items: center;
  justify-content: center;

  margin-right: 17px;

  flex-shrink: 0;

  overflow: hidden;

  font-weight: 900;

  font-size: 29px;

  color: white;
}

/* Instagram */

.instagram {
  background:
    radial-gradient(
      circle at 30% 110%,
      #fdf497 0%,
      #fdf497 5%,
      #fd5949 45%,
      #d6249f 60%,
      #285AEB 90%
    );
}

/* faux logo Instagram */

.instagram-logo {
  width: 30px;
  height: 30px;

  border: 3px solid white;

  border-radius: 9px;

  position: relative;
}

.instagram-logo::before {
  content: "";

  position: absolute;

  width: 10px;
  height: 10px;

  border: 3px solid white;

  border-radius: 50%;

  left: 7px;
  top: 7px;
}

.instagram-logo::after {
  content: "";

  position: absolute;

  width: 4px;
  height: 4px;

  background: white;

  border-radius: 50%;

  right: 3px;
  top: 3px;
}

/* TikTok */

.tiktok {
  background: #050505;
}

.tiktok-logo {
  font-size: 32px;
  font-weight: 900;
  text-shadow:
    3px 2px 0 #25f4ee,
    -2px -1px 0 #fe2c55;
}

/* Facebook */

.facebook {
  background: #1877f2;

  font-family: Arial, sans-serif;

  font-size: 36px;
  font-weight: 900;
}

/* Boutique */

.shop {
  background: #d45b2d;
}

/* TenUp */

.tenup {
  background: #a9c62d;
}

/* =========================
   TEXTE
========================= */

.btn-content {
  flex: 1;
}

.btn-title {
  display: block;

  font-size: 19px;

  font-weight: 850;
}

.btn-subtitle {
  display: block;

  margin-top: 4px;

  font-size: 13px;

  color: #788078;
}

.arrow {
  font-size: 31px;

  color: #718077;

  margin-left: 8px;

  transition: transform .2s ease;
}

.btn:hover .arrow {
  transform: translateX(5px);
}

/* =========================
   FOOTER
========================= */

.footer {
  margin-top: 27px;

  text-align: center;

  color: rgba(255,255,255,.55);

  font-size: 11px;
}

/* =========================
   ANIMATIONS
========================= */

@keyframes headerAppear {

  from {
    opacity: 0;
    transform: translateY(-25px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes logoFloat {

  0%,100% {
    transform: translateY(0) rotate(0deg);
  }

  50% {
    transform: translateY(-5px) rotate(2deg);
  }
}

@keyframes cardAppear {

  from {
    opacity: 0;
    transform: translateY(25px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* =========================
   MOBILE
========================= */

@media (max-width: 400px) {

  .container {
    padding-left: 13px;
    padding-right: 13px;
  }

  .club-logo {
    width: 78px;
    height: 78px;
  }

  .logo-title {
    font-size: 64px;
  }

  .city {
    font-size: 23px;
  }

  .tagline {
    font-size: 14px;
  }

  .btn {
    min-height: 82px;
    padding: 11px 14px;
  }

  .icon {
    width: 51px;
    height: 51px;
    margin-right: 13px;
  }

  .btn-title {
    font-size: 17px;
  }

  .btn-subtitle {
    font-size: 12px;
  }
}
